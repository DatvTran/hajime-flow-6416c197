services:
  postgres:
    image: postgres:16-alpine
    container_name: hajime-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hajime_dev
    volumes:
      - hajime_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hajime_dev"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  hajime_pg_data:
